name: vangelo
on:
  schedule:
    - cron: "5 22 * * *"
    - cron: "5 23 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vangelo
  cancel-in-progress: false
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python vangelo.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: debug
          path: |
            debug.html
            debug.txt
      - name: Salva i file JSON
        run: |
          git config user.name "vangelo-bot"
          git config user.email "vangelo-bot@users.noreply.github.com"
          git add -A -- '*.json'
          git diff --cached --quiet || (git commit -m "aggiorna liturgia" && git push)
